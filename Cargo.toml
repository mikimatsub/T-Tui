[package]
name = "ttui"
version = "1.0.0-rc.1"
edition = "2024"
description = "A keyboard-first terminal companion for Tinder on Linux and Windows"
license = "MIT"
repository = "https://github.com/mikimatsub/T-Tui"
readme = "README.md"
publish = false

[profile.release]
strip = "symbols"
lto = "thin"

[patch.crates-io]
# Remove when a published Crossterm release fixes upstream #1072.
crossterm = { path = "vendor/crossterm" }

[dependencies]
anyhow = "1.0.104"
async-trait = "0.1.92"
chrono = { version = "0.4.45", features = ["serde"] }
crossterm = "0.29.0"
dirs = "7.0.0"
image = { version = "0.25.10", default-features = false, features = ["jpeg", "png", "webp"] }
ratatui = "0.30.2"
reqwest = { version = "0.13.5", default-features = false, features = ["json", "rustls", "query"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
thiserror = "2.0.20"
tokio = { version = "1.53.1", features = ["rt-multi-thread", "macros", "time", "sync"] }
unicode-width = "0.2.0"
unicode-segmentation = "1.13.3"
url = "2.5.8"
uuid = { version = "1.26.1", features = ["v4", "serde"] }
ratatui-image = { version = "11.0.8", default-features = false, features = ["crossterm"] }
rustix = { version = "0.38.44", features = ["event", "stdio", "termios"] }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61.2", features = ["Win32_Foundation", "Win32_Security_Cryptography", "Win32_UI_Shell", "Win32_UI_WindowsAndMessaging"] }

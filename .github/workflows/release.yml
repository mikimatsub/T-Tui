name: Release
on:
  push:
    tags: ['v*']
permissions:
  contents: read
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false
jobs:
  ci:
    uses: ./.github/workflows/ci.yml
  security:
    uses: ./.github/workflows/security.yml
    permissions:
      contents: read
      actions: read
      security-events: write
      pull-requests: read
  publish:
    needs: [ci, security]
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    environment: release
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.14.8'
      - name: Verify release metadata
        env:
          RELEASE_TAG: ${{ github.ref_name }}
          REPOSITORY_PRIVATE: ${{ github.event.repository.private }}
        run: |
          test "$REPOSITORY_PRIVATE" = false
          git merge-base --is-ancestor HEAD origin/main
          python scripts/release.py check --tag "$RELEASE_TAG"
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: native-*
          path: dist
          merge-multiple: true
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: npm-package
          path: dist
      - name: Verify archive checksums
        working-directory: dist
        run: sha256sum --check *.sha256
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: dist/*
      - name: Generate stable WinGet manifest
        if: ${{ !contains(github.ref_name, '-') }}
        run: python scripts/release.py winget --artifacts dist --output dist/winget
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          extra=()
          if [[ "$RELEASE_TAG" == *-* ]]; then extra+=(--prerelease); fi
          gh release create "$RELEASE_TAG" dist/*.zip dist/*.tar.gz dist/*.sha256 dist/*.tgz --verify-tag --generate-notes "${extra[@]}"
          if [[ -d dist/winget ]]; then
            gh release upload "$RELEASE_TAG" dist/winget/*.yaml
          fi
  npm:
    name: Publish npm
    needs: publish
    # First publication establishes package ownership; enable after trusted setup.
    if: vars.NPM_PUBLISH_ENABLED == 'true'
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    environment: release
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24.21.0'
          registry-url: https://registry.npmjs.org
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: npm-package
          path: dist
      - name: Publish tested tarball through trusted publishing
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          channel=latest
          if [[ "$RELEASE_TAG" == *-* ]]; then channel=next; fi
          npm publish dist/*.tgz --provenance --access public --tag "$channel" --ignore-scripts

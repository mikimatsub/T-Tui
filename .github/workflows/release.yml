name: Release
on:
  push:
    tags: ['v*', '!v*-npm-recovery']
  # npm-only recovery: dispatch on a `<tag>-npm-recovery` tag (the release
  # environment only admits v* tags). It republishes nothing else and never
  # rebuilds; it publishes the attested tarball from the existing release.
  workflow_dispatch:
    inputs:
      release_tag:
        description: Existing release tag whose attested npm tarball should be published (e.g. v1.0.0)
        required: true
        type: string
permissions:
  contents: read
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false
jobs:
  ci:
    if: github.event_name == 'push'
    uses: ./.github/workflows/ci.yml
  security:
    if: github.event_name == 'push'
    uses: ./.github/workflows/security.yml
    permissions:
      contents: read
      actions: read
      security-events: write
      pull-requests: read
  publish:
    needs: [ci, security]
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    environment: release
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.14.8'
      - name: Verify release metadata
        env:
          RELEASE_TAG: ${{ github.ref_name }}
          REPOSITORY_PRIVATE: ${{ github.event.repository.private }}
        run: |
          test "$REPOSITORY_PRIVATE" = false
          git merge-base --is-ancestor HEAD origin/main
          python scripts/release.py check --tag "$RELEASE_TAG"
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: native-*
          path: dist
          merge-multiple: true
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: npm-package
          path: dist
      - name: Verify archive checksums
        working-directory: dist
        run: sha256sum --check *.sha256
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: dist/*
      - name: Generate stable WinGet manifest
        if: ${{ !contains(github.ref_name, '-') }}
        run: python scripts/release.py winget --artifacts dist --output dist/winget
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          extra=()
          if [[ "$RELEASE_TAG" == *-* ]]; then extra+=(--prerelease); fi
          gh release create "$RELEASE_TAG" dist/*.zip dist/*.tar.gz dist/*.sha256 dist/*.tgz --verify-tag --generate-notes "${extra[@]}"
          if [[ -d dist/winget ]]; then
            gh release upload "$RELEASE_TAG" dist/winget/*.yaml
          fi
  verify:
    name: Published install (${{ matrix.os }})
    needs: publish
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, windows-2025]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    permissions:
      contents: read
      attestations: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.14.8'
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24.22.1'
      - name: Download, attest and smoke test the public release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_COMMIT: ${{ github.sha }}
        shell: bash
        run: python scripts/published_smoke.py --commit "$RELEASE_COMMIT"
  npm:
    name: Publish npm
    needs: verify
    # First publication establishes package ownership; enable after trusted setup.
    if: vars.NPM_PUBLISH_ENABLED == 'true'
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    environment: release
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24.22.1'
          registry-url: https://registry.npmjs.org
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: npm-package
          path: dist
      - name: Publish tested tarball through trusted publishing
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          channel=latest
          if [[ "$RELEASE_TAG" == *-* ]]; then channel=next; fi
          npm publish ./dist/*.tgz --provenance --access public --tag "$channel" --ignore-scripts
  npm-recover:
    name: Recover npm publication
    if: >-
      github.event_name == 'workflow_dispatch' &&
      vars.NPM_PUBLISH_ENABLED == 'true' &&
      github.ref_type == 'tag' &&
      github.ref_name == format('{0}-npm-recovery', inputs.release_tag)
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    environment: release
    permissions:
      contents: read
      id-token: write
      attestations: read
    steps:
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24.22.1'
          registry-url: https://registry.npmjs.org
      - name: Download and verify the attested release tarball
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.release_tag }}
          REPO: ${{ github.repository }}
        run: |
          [[ "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.]+)?$ ]] || { echo "bad tag"; exit 1; }
          mkdir dist
          gh release download "$RELEASE_TAG" -R "$REPO" -p '*.tgz' -D dist
          f=$(ls dist/*.tgz); [ "$(ls dist/*.tgz | wc -l)" = 1 ]
          gh attestation verify "$f" -R "$REPO" \
            --signer-workflow "$REPO/.github/workflows/release.yml" \
            --source-ref "refs/tags/$RELEASE_TAG"
          name=$(tar xzOf "$f" package/package.json | jq -r .name)
          version=$(tar xzOf "$f" package/package.json | jq -r .version)
          [ "v$version" = "$RELEASE_TAG" ] || { echo "version mismatch"; exit 1; }
          if npm view "$name@$version" version >/dev/null 2>&1; then echo "$name@$version already on npm"; exit 1; fi
      - name: Publish attested tarball through trusted publishing
        env:
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: |
          channel=latest
          if [[ "$RELEASE_TAG" == *-* ]]; then channel=next; fi
          npm publish ./dist/*.tgz --provenance --access public --tag "$channel" --ignore-scripts
